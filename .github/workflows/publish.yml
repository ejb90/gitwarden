name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
  publish:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.result == 'success'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v3
        with:
          python-version: 3.12

      - name: Sync optional dependencies
        run: uv sync --extra dev

      - name: Build package
        run: |
          rm -rf dist/
          uv build
          uv run twine check dist/*

      - name: Publish to PyPI
        run: |
          uv run twine upload --repository pypi dist/*

  trigger-rtd:
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.result == 'success'
    steps:
      - name: Trigger Read the Docs build
        run: |
          curl -X POST \
            -H "Authorization: Token ${{ secrets.READTHEDOCS_API_KEY }}" \
            https://readthedocs.org/api/v3/projects/gitconductor/versions/latest/builds/
